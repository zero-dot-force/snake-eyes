# Publishes snake-eyes to PyPI. Run from main with the tag (don't push
# tags yourself):
#
#   gh workflow run release.yml -f tag=v0.2.0
#
# The front half is jflowers/ship's shared tag-release.yml: the run must be
# on main; org-infra's preflight checks the tag (semver, new, newer than the
# last), that the CI checks below passed on HEAD and that there are
# unreleased commits, then creates the tag; the GitHub release is created
# with generated notes. The publish job below then checks out the tag,
# builds the sdist and wheel, publishes them to PyPI through trusted
# publishing (OIDC) in the protected `release` environment, generates an
# SPDX SBOM, and uploads all of them to the release.
#
# PyPI's trusted publisher names this repository, this file (release.yml)
# and the `release` environment, so the publish step stays in this job: it
# can't move into a shared workflow without re-registering the publisher.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string
      skip_semver_check:
        description: 'Skip semver ordering validation'
        required: false
        type: boolean
        default: false
      skip_ci_checks:
        description: 'Skip CI check-run verification'
        required: false
        type: boolean
        default: false
      skip_unreleased_check:
        description: 'Skip unreleased-commit check'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: jflowers/ship/.github/workflows/tag-release.yml@01e205c8897d54daac4d30b81710c695bfd1f31b # v0.10.0
    with:
      tag: ${{ inputs.tag }}
      ci_checks: '["test (3.11)", "test (3.12)"]'
      skip_semver_check: ${{ inputs.skip_semver_check }}
      skip_ci_checks: ${{ inputs.skip_ci_checks }}
      skip_unreleased_check: ${{ inputs.skip_unreleased_check }}
      allow_prerelease: true
    permissions:
      contents: write
      checks: read

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      url: https://pypi.org/p/snake-eyes-analyzer
    permissions:
      contents: write # uploads to the release
      id-token: write # trusted publishing
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build sdist and wheel
        run: uv build

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* sbom.spdx.json --repo "$GITHUB_REPOSITORY" --clobber
