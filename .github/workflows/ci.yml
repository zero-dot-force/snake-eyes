# This workflow runs lint, formatting, type checking, and tests with
# coverage on every push and pull request to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Learnings-only and toolkit-rollout PRs skip the test matrix; pushes and
  # every other PR run it. See jflowers/ship's README, "pr-scope.yml".
  scope:
    uses: jflowers/ship/.github/workflows/pr-scope.yml@3b0ce8bf47183be402df9eaec16644c213eee5f7 # main, after v0.11.0
    permissions:
      contents: read

  test:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy src/
      - run: uv run pytest --cov=snake_eyes --cov-report=term-missing --cov-fail-under=85
      - run: |
          set -o pipefail
          uv run coverage report --include='src/snake_eyes/signals/visibility.py,src/snake_eyes/signals/adapter.py' --fail-under=95 --show-missing | tee /tmp/per-module-cov.txt
          grep -q 'signals/visibility.py' /tmp/per-module-cov.txt
          grep -q 'signals/adapter.py' /tmp/per-module-cov.txt

  # The one required check: a skipped matrix reports no per-leg checks, so
  # this always runs and fails unless scope succeeded and the test matrix
  # passed (code PRs) or was skipped (chore PRs).
  ci-ok:
    name: CI OK
    needs: [scope, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          TEST: ${{ needs.test.result }}
        run: |
          [ "$SCOPE" = success ] || { echo "::error::scope: $SCOPE"; exit 1; }
          case "$CODE" in
            true) [ "$TEST" = success ] || { echo "::error::test: $TEST"; exit 1; } ;;
            false) [ "$TEST" = skipped ] || { echo "::error::test: $TEST"; exit 1; } ;;
            *) echo "::error::scope code '$CODE'"; exit 1 ;;
          esac
