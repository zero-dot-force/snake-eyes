# Dependabot PRs for our own orgs' packages merge themselves, by rebase,
# once main's required checks pass: patch and minor only. That includes
# the bumps to jflowers/ship's pins, so this repo picks up each ship
# release by itself. Third-party updates wait for a person. See
# jflowers/ship's README, "deps-automerge.yml".
name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  automerge:
    uses: jflowers/ship/.github/workflows/deps-automerge.yml@01e205c8897d54daac4d30b81710c695bfd1f31b # v0.10.0
    permissions:
      contents: write
      pull-requests: write
